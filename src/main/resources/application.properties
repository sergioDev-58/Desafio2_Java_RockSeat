# ==========================================
# IDENTIFICACAO DA APLICACAO
# ==========================================
spring.application.name=api_cursos

# Ambiente ativo
spring.profiles.active=dev

# ==========================================
# CONFIGURACAO DO SERVIDOR
# ==========================================
server.port=8080

# ==========================================
# BANCO DE DADOS - POSTGRESQL
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/api_cursos}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# FLYWAY - MIGRACOES DO BANCO
# ==========================================
#spring.flyway.enabled=true
#spring.flyway.locations=classpath:db/migration
#spring.flyway.baseline-on-migrate=false

# ==========================================
# LOGS
# ==========================================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# ==========================================
# ACTUATOR - MONITORAMENTO
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ==========================================
# SECRET DO SISTEMA DSE GERAÇÃO DO TOKEN.
# ==========================================
security.token.secret=APICURSOS_@123#
security.token.secret.candidate=APICURSOS_@123#Cursos

# ===========================================
# Configuração DEVTOOLS.
#============================================
# Reinício automático quando algum arquivo da aplicação mudar
spring.devtools.restart.enabled=true

# Pastas observadas além do classpath (opcional)
spring.devtools.restart.additional-paths=src/main/java

# Arquivos que NÃO devem causar reinício
#spring.devtools.restart.exclude=static/**,public/**,templates/**

# Intervalo de verificação de mudanças
spring.devtools.restart.poll-interval=1s

# Tempo de "silêncio" sem mudanças antes de reiniciar
spring.devtools.restart.quiet-period=400ms

